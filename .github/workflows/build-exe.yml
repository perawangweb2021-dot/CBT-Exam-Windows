name: Build CBT Exam Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download School Logo and Convert to ICO
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://smpn1tualang.sch.id/images/aplikasi/logo.png" -OutFile "logo.png"
        Add-Type -AssemblyName System.Drawing
        $bmp = [System.Drawing.Bitmap]::FromFile("logo.png")
        $resized = New-Object System.Drawing.Bitmap($bmp, 128, 128)
        $icon = [System.Drawing.Icon]::FromHandle($resized.GetHicon())
        $fs = New-Object System.IO.FileStream("app.ico", [System.IO.FileMode]::Create)
        $icon.Save($fs)
        $fs.Close()

    - name: Publish Single-File EXE
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CBT-Exam-SMPN1Tualang-Windows
        path: ./publish/CBT-Exam-SMPN1Tualang.exe
